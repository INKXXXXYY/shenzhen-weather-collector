name: Hourly Weather Collector

on:
  schedule:
    # 每小时跑两次（:03 和 :33），保证 Actions 队列延迟时至少命中一次
    - cron: "3 * * * *"
    - cron: "33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8          # 硬限制，防止 job 超时拖累下一个 slot
    env:
      QWEATHER_API_KEY:   ${{ secrets.QWEATHER_API_KEY }}
      QWEATHER_API_HOST:  ${{ secrets.QWEATHER_API_HOST }}
      QWEATHER_LOCATION:  "114.06,22.54"
      QWEATHER_LANG:      "zh"
      QWEATHER_UNIT:      "m"
      LOCATION_NAME:      "深圳市"
      LAT:                "22.543096"
      LON:                "114.057865"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: python collect_weather.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather_log.csv || true
          git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push
